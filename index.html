<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="card">
      <h1 id="event-title">Ночь в музее</h1>
      <p>15 ноября, 18:30</p>
      <p>Музей космонавтики, проспект Мира, 111</p>
      <p>Вечерняя программа с выставкой и экскурсиями</p>
    </section>

    <button id="show-program" type="button">Показать программу</button>
    <div id="program" hidden></div>

    <form id="service-form" hidden>
      <p class="field">
        <label><input type="checkbox" id="guide"> Экскурсия с гидом</label>
      </p>
      <p class="field">
        <label><input type="checkbox" id="audio"> Аудиогид</label>
      </p>
      <p class="field">
        <label><input type="checkbox" id="catalog"> Каталог выставки</label>
      </p>
      <button type="submit">Показать итог</button>
    </form>

    <p id="choice-error" hidden>Выберите хотя бы одну услугу.</p>
    <p id="data-error" hidden>Ошибка данных.</p>
    <p id="result" hidden></p>
    <pre id="report-json" hidden></pre>
  </main>

  <script src="app.js"></script>
</body>
</html>
